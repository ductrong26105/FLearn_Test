<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard - FLearn LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
    <a class="navbar-brand fw-bold" href="#">Trang Chủ Giáo Viên - FLearn</a>
    <div class="d-flex align-items-center">
        <span class="text-white me-3" th:text="'Xin chào, thầy/cô ' + ${teacherName}"></span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-light">Đăng xuất</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-success text-white fw-bold">Tạo Lớp Học Mới</div>
                <div class="card-body">
                    <form th:action="@{/teacher/create-class}" method="post">
                        <div class="mb-3">
                            <label class="form-label small">Tên lớp (Môn học)</label>
                            <input type="text" name="className" class="form-control" placeholder="VD: SWP391 - ABC " required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Tạo Lớp</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Các Lớp Đang Quản Lý</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Tên Lớp</th>
                            <th>Mã Tham Gia (Invite Code)</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cls : ${classes}">
                            <td th:text="${cls.classId}"></td>

                            <td class="fw-bold">
                                <a th:href="@{/teacher/class/{id}(id=${cls.classId})}"
                                   class="text-decoration-none text-primary"
                                   th:text="${cls.className}">
                                </a>
                            </td>

                            <td><span class="badge bg-secondary fs-6" th:text="${cls.inviteCode}"></span></td>

                            <td>
                                <span th:if="${cls.isActive}" class="text-success small fw-bold">Đang mở</span>
                                <span th:unless="${cls.isActive}" class="text-danger small fw-bold">Bảo trì</span>
                            </td>

                            <td>
                                <a th:href="@{/teacher/class/{id}(id=${cls.classId})}"
                                   class="btn btn-sm btn-primary me-1">
                                    Quản lý bài giảng
                                </a>

                                <a th:href="@{/teacher/class/{id}/approvals(id=${cls.classId})}"
                                   class="btn btn-sm btn-warning fw-bold me-1">
                                    👥 Duyệt học viên
                                </a>

                                <form th:action="@{/teacher/toggle-class}" method="post" class="d-inline">
                                    <input type="hidden" name="classId" th:value="${cls.classId}">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${cls.isActive ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:text="${cls.isActive ? 'Tạm đóng' : 'Mở lại'}"></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(classes)}">
                            <td colspan="5" class="text-center text-muted py-3">Chưa có lớp học nào. Hãy tạo một lớp mới!</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
