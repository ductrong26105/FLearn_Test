<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết Quả Chấm Điểm - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5">
                <h1 class="text-success fw-bold">🎉 Nộp Bài Thành Công!</h1>
                <p class="text-muted fs-5 mt-2">Hệ thống FLearn đã hoàn tất chấm điểm bài trắc nghiệm của bạn.</p>
                <hr>
                <div class="my-4">
                    <span class="text-dark fs-4">Điểm số đạt được:</span>
                    <h1 class="display-2 fw-bold text-primary mt-2" th:text="${score} + ' / 10'"></h1>
                </div>
                <hr>
                <div class="mt-3">
                    <a th:href="@{/student/dashboard}" class="btn btn-primary btn-lg px-4">Quay lại Bàn Học Chính</a>
                </div>
            </div>
        </div>
    </div>
</div>
