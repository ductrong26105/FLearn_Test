<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận OTP - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        .otp-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .otp-box {
            width: 52px;
            height: 60px;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            transition: border-color .2s, box-shadow .2s;
            caret-color: transparent;
        }
        .otp-box:focus {
            border-color: var(--bs-primary, #6c5fcf);
            box-shadow: 0 0 0 3px rgba(108,95,207,.18);
            outline: none;
        }
        #countdown-bar {
            transition: width .9s linear;
        }
    </style>
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mb-3">F</div>
            <h1 class="h3 fw-bold mb-1">Nhập mã OTP</h1>
            <p class="text-muted mb-0">
                Mã 6 chữ số đã được gửi đến
                <strong th:text="${email != null ? email : 'email của bạn'}">email</strong>.
            </p>
        </div>

        <!-- Progress steps -->
        <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
            <div class="d-flex align-items-center gap-2">
                <span class="badge rounded-circle bg-success d-flex align-items-center justify-content-center" style="width:28px;height:28px;font-size:.85rem;"><i class="bi bi-check-lg"></i></span>
                <small class="text-muted">Nhập email</small>
            </div>
            <div class="flex-grow-1 border-top mx-1" style="max-width:40px;"></div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge rounded-circle bg-primary d-flex align-items-center justify-content-center" style="width:28px;height:28px;font-size:.85rem;">2</span>
                <small class="fw-semibold text-primary">Nhập OTP</small>
            </div>
            <div class="flex-grow-1 border-top mx-1" style="max-width:40px;"></div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge rounded-circle bg-secondary d-flex align-items-center justify-content-center" style="width:28px;height:28px;font-size:.85rem;">3</span>
                <small class="text-muted">Mật khẩu mới</small>
            </div>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger py-2 text-center" th:text="${errorMsg}"></div>

        <!-- Countdown bar -->
        <div class="mb-3">
            <div class="d-flex justify-content-between mb-1">
                <small class="text-muted">Mã còn hiệu lực</small>
                <small id="countdown-text" class="fw-semibold text-primary">5:00</small>
            </div>
            <div class="progress" style="height: 5px;">
                <div id="countdown-bar" class="progress-bar bg-primary" style="width: 100%;"></div>
            </div>
        </div>

        <form id="otp-form" th:action="@{/verify-otp}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <!-- Email ẩn để truyền sang bước tiếp theo -->
            <input type="hidden" name="email" id="emailField" th:value="${email != null ? email : ''}">

            <!-- OTP digit inputs -->
            <div class="otp-input-group mb-4" id="otp-boxes">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-0" autocomplete="off">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-1" autocomplete="off">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-2" autocomplete="off">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-3" autocomplete="off">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-4" autocomplete="off">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="otp-5" autocomplete="off">
            </div>
            <!-- Hidden combined OTP field -->
            <input type="hidden" name="otpCode" id="otpCode">

            <button type="submit" id="submit-btn" class="btn btn-brand w-100 py-2" disabled>
                <i class="bi bi-shield-check me-2"></i>Xác nhận OTP
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">Không nhận được mã?</span>
            <a href="/forgot-password" class="text-decoration-none brand-text fw-semibold small ms-1">Gửi lại OTP</a>
        </div>
        <div class="text-center mt-2">
            <a href="/login" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
            </a>
        </div>
    </section>
</main>

<script>
    // ---- OTP digit boxes logic ----
    const boxes = document.querySelectorAll('.otp-box');
    const otpCodeField = document.getElementById('otpCode');
    const submitBtn = document.getElementById('submit-btn');

    boxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\D/g, '');
            box.value = val ? val[0] : '';
            if (val && idx < boxes.length - 1) {
                boxes[idx + 1].focus();
            }
            updateOtpField();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && idx > 0) {
                boxes[idx - 1].focus();
                boxes[idx - 1].value = '';
                updateOtpField();
            }
        });

        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
            [...paste.substring(0, 6)].forEach((char, i) => {
                if (boxes[i]) boxes[i].value = char;
            });
            updateOtpField();
            const nextEmpty = [...boxes].findIndex(b => !b.value);
            (nextEmpty !== -1 ? boxes[nextEmpty] : boxes[5]).focus();
        });
    });

    function updateOtpField() {
        const otp = [...boxes].map(b => b.value).join('');
        otpCodeField.value = otp;
        submitBtn.disabled = otp.length < 6;
    }

    // Auto focus first box
    boxes[0].focus();

    // ---- Countdown timer (10 minutes = 600 seconds) ----
    const TOTAL = 600;
    let remaining = TOTAL;
    const countdownText = document.getElementById('countdown-text');
    const countdownBar = document.getElementById('countdown-bar');

    const tick = () => {
        if (remaining <= 0) {
            countdownText.textContent = 'Hết hạn';
            countdownText.classList.replace('text-primary', 'text-danger');
            countdownBar.classList.replace('bg-primary', 'bg-danger');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mã OTP đã hết hạn';
            return;
        }
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        countdownText.textContent = `${m}:${String(s).padStart(2, '0')}`;
        countdownBar.style.width = `${(remaining / TOTAL) * 100}%`;
        if (remaining <= 60) {
            countdownText.classList.replace('text-primary', 'text-warning');
            countdownBar.classList.replace('bg-primary', 'bg-warning');
        }
        remaining--;
        setTimeout(tick, 1000);
    };
    tick();
</script>
</body>
</html>
