<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold brand-text" th:href="@{/dashboard}">FLearn</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
        </form>
    </div>
</nav>

<main class="auth-page" style="min-height: calc(100vh - 64px);">
    <section class="auth-card">
        <div class="mb-4">
            <h1 class="h3 fw-bold mb-1">Đổi mật khẩu</h1>
            <p class="text-muted mb-0">Cập nhật mật khẩu để bảo vệ tài khoản của bạn.</p>
        </div>

        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <form th:action="@{/change-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu hiện tại</label>
                <input type="password" name="currentPassword" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-control" minlength="6" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2">Cập nhật mật khẩu</button>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary w-100 mt-2">Quay lại dashboard</a>
        </form>
    </section>
</main>
</body>
</html>
