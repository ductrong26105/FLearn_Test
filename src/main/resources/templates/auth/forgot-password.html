<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">

        <div class="text-center mb-4">
            <div class="brand-mark mb-3">F</div>
            <h1 class="h3 fw-bold mb-1">Quên mật khẩu?</h1>
            <p class="text-muted small mb-0">
                Nhập email tài khoản — chúng tôi sẽ gửi mã OTP để đặt lại mật khẩu.
            </p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMsg}" class="alert alert-danger py-2 small" th:text="${errorMsg}"></div>
        <div th:if="${successMsg}" class="alert alert-success py-2 small" th:text="${successMsg}"></div>

        <form th:action="@{/forgot-password}" method="post" id="forgot-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="example@email.com" required autofocus>
                </div>
                <div class="form-text">Hệ thống sẽ gửi mã OTP 6 chữ số về email này.</div>
            </div>

            <button type="submit" class="btn btn-brand w-100 py-2 fw-semibold" id="send-btn">
                <span id="btn-text"><i class="bi bi-send me-2"></i>Gửi mã OTP</span>
                <span id="btn-loading" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2"></span>Đang gửi...
                </span>
            </button>
        </form>

        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
            </a>
        </div>
    </section>
</main>

<script>
    document.getElementById('forgot-form').addEventListener('submit', function () {
        const btn = document.getElementById('send-btn');
        document.getElementById('btn-text').classList.add('d-none');
        document.getElementById('btn-loading').classList.remove('d-none');
        btn.disabled = true;
    });
</script>
</body>
</html>
