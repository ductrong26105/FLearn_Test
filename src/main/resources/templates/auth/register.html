<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký sinh viên - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mb-3">F</div>
            <h1 class="h3 fw-bold mb-1">Đăng ký sinh viên</h1>
            <p class="text-muted mb-0">Tài khoản có thể đăng nhập ngay sau khi tạo.</p>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger py-2" th:text="${errorMsg}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Họ và tên</label>
                <input type="text" name="fullName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2">Tạo tài khoản</button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none brand-text fw-semibold">Quay lại đăng nhập</a>
        </div>
    </section>
</main>
</body>
</html>
