<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        .otp-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .otp-box {
            width: 48px;
            height: 56px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            transition: border-color .2s, box-shadow .2s, background .2s;
            caret-color: transparent;
        }
        .otp-box:focus {
            border-color: #6c5fcf;
            box-shadow: 0 0 0 3px rgba(108,95,207,.15);
            outline: none;
        }
        .otp-box.is-filled {
            border-color: #6c5fcf;
            background: rgba(108,95,207,.06);
        }
        .otp-box.is-verified {
            border-color: #198754;
            background: rgba(25,135,84,.07);
        }
        .strength-track { height: 4px; border-radius: 4px; overflow: hidden; background: #e9ecef; }
        .strength-fill  { height: 100%; border-radius: 4px; transition: width .35s, background .35s; width: 0; }
        #countdown-text { font-variant-numeric: tabular-nums; }

        /* Password section — ẩn ban đầu, slide xuống khi OTP đủ */
        #pw-section {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .5s ease, opacity .4s ease, margin .4s ease;
            margin-top: 0;
        }
        #pw-section.visible {
            max-height: 600px;
            opacity: 1;
            margin-top: 1rem;
        }
        /* OTP verified badge */
        #otp-verified-badge {
            display: none;
            animation: fadeIn .3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<main class="auth-page">
    <section class="auth-card">

        <div class="text-center mb-4">
            <div class="brand-mark mb-3">F</div>
            <h1 class="h3 fw-bold mb-1">Đặt lại mật khẩu</h1>
            <p class="text-muted small mb-0">
                Mã OTP đã được gửi đến
                <strong class="text-dark" th:text="${email != null ? email : 'email của bạn'}">email</strong>.
                <a th:href="@{/forgot-password}" class="brand-text text-decoration-none small ms-1">Đổi email</a>
            </p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMsg}" class="alert alert-danger py-2 small" th:text="${errorMsg}"></div>
        <div th:if="${successMsg}" class="alert alert-success py-2 small" th:text="${successMsg}"></div>

        <!-- Countdown -->
        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <small class="text-muted">Mã OTP còn hiệu lực</small>
                <small id="countdown-text" class="fw-semibold text-primary">10:00</small>
            </div>
            <div class="strength-track">
                <div id="countdown-fill" class="strength-fill bg-primary" style="width:100%"></div>
            </div>
        </div>

        <form th:action="@{/reset-password}" method="post" id="reset-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="email" id="emailHidden" th:value="${email}">
            <input type="hidden" name="otpCode" id="otpHidden">

            <!-- ======= BƯỚC 1: OTP ======= -->
            <div class="mb-2">
                <label class="form-label fw-semibold text-center w-100">Nhập mã OTP (6 chữ số)</label>
                <div class="otp-group" id="otp-group">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o0" autocomplete="off">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o1" autocomplete="off">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o2" autocomplete="off">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o3" autocomplete="off">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o4" autocomplete="off">
                    <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="o5" autocomplete="off">
                </div>

                <!-- Badge xuất hiện khi nhập đủ 6 số -->
                <div id="otp-verified-badge" class="text-center mt-2">
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                        <i class="bi bi-check-circle-fill me-1"></i>Mã OTP hợp lệ — Tiếp tục đặt mật khẩu
                    </span>
                </div>
            </div>

            <!-- ======= BƯỚC 2: Mật khẩu mới (ẩn cho đến khi OTP đủ) ======= -->
            <div id="pw-section">
                <hr class="my-3">

                <!-- New password -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="newPassword" name="newPassword"
                               class="form-control" placeholder="Tối thiểu 6 ký tự"
                               autocomplete="new-password">
                        <button type="button" class="btn btn-outline-secondary" id="toggleNew">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <div class="strength-track">
                            <div id="pw-strength-fill" class="strength-fill"></div>
                        </div>
                        <small id="pw-strength-text" class="text-muted"></small>
                    </div>
                </div>

                <!-- Confirm password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="bi bi-lock-fill text-muted"></i></span>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               class="form-control" placeholder="Nhập lại mật khẩu"
                               autocomplete="new-password">
                        <button type="button" class="btn btn-outline-secondary" id="toggleConfirm">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <small id="match-msg" class="text-danger d-none">Mật khẩu xác nhận chưa khớp.</small>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-brand w-100 py-2 fw-semibold" disabled>
                    <i class="bi bi-shield-lock me-2"></i>Cập nhật mật khẩu
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Không nhận được mã?</small>
            <a th:href="@{/forgot-password}" class="brand-text text-decoration-none small ms-1 fw-semibold">Gửi lại OTP</a>
        </div>
    </section>
</main>

<script>
/* -------- OTP boxes -------- */
const boxes      = Array.from(document.querySelectorAll('.otp-box'));
const otpHidden  = document.getElementById('otpHidden');
const submitBtn  = document.getElementById('submit-btn');
const pwSection  = document.getElementById('pw-section');
const otpBadge   = document.getElementById('otp-verified-badge');

boxes.forEach((box, idx) => {
    box.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g, '');
        box.value = v ? v[0] : '';
        box.classList.toggle('is-filled', !!box.value);
        if (v && idx < boxes.length - 1) boxes[idx + 1].focus();
        syncOtp();
    });
    box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && idx > 0) {
            boxes[idx - 1].focus();
            boxes[idx - 1].value = '';
            boxes[idx - 1].classList.remove('is-filled', 'is-verified');
            syncOtp();
        }
    });
    box.addEventListener('paste', e => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
        [...paste.substring(0, 6)].forEach((ch, i) => {
            if (boxes[i]) { boxes[i].value = ch; boxes[i].classList.add('is-filled'); }
        });
        syncOtp();
        const next = boxes.findIndex(b => !b.value);
        (next !== -1 ? boxes[next] : boxes[5]).focus();
    });
});

function syncOtp() {
    const otp     = boxes.map(b => b.value).join('');
    const isFull  = otp.length === 6;
    otpHidden.value = otp;

    if (isFull) {
        // Đổi màu ô thành xanh lá + hiện badge + mở phần mật khẩu
        boxes.forEach(b => { b.classList.remove('is-filled'); b.classList.add('is-verified'); });
        otpBadge.style.display = 'block';
        pwSection.classList.add('visible');
        // Focus vào ô mật khẩu mới
        setTimeout(() => document.getElementById('newPassword').focus(), 300);
    } else {
        boxes.forEach(b => {
            b.classList.remove('is-verified');
            if (b.value) b.classList.add('is-filled');
        });
        otpBadge.style.display = 'none';
        pwSection.classList.remove('visible');
    }
    checkSubmit();
}

/* -------- Password show/hide -------- */
function togglePw(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', function () {
        const inp = document.getElementById(inputId);
        const ico = this.querySelector('i');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        ico.classList.toggle('bi-eye',       inp.type === 'password');
        ico.classList.toggle('bi-eye-slash', inp.type === 'text');
    });
}
togglePw('toggleNew',     'newPassword');
togglePw('toggleConfirm', 'confirmPassword');

/* -------- Password strength -------- */
const pwInput = document.getElementById('newPassword');
const fillEl  = document.getElementById('pw-strength-fill');
const textEl  = document.getElementById('pw-strength-text');

pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let s = 0;
    if (v.length >= 6)          s++;
    if (v.length >= 10)         s++;
    if (/[A-Z]/.test(v))       s++;
    if (/[0-9]/.test(v))       s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    const levels = [
        { w:'0%',   cls:'',           label:'' },
        { w:'20%',  cls:'bg-danger',  label:'Rất yếu' },
        { w:'40%',  cls:'bg-warning', label:'Yếu' },
        { w:'60%',  cls:'bg-info',    label:'Trung bình' },
        { w:'80%',  cls:'bg-primary', label:'Mạnh' },
        { w:'100%', cls:'bg-success', label:'Rất mạnh' },
    ];
    const lv = levels[s];
    fillEl.style.width = lv.w;
    fillEl.className   = 'strength-fill ' + lv.cls;
    textEl.textContent = lv.label;
    textEl.className   = 'small ' + (s >= 3 ? 'text-success' : 'text-muted');
    checkMatch();
});

/* -------- Confirm match -------- */
const cfInput  = document.getElementById('confirmPassword');
const matchMsg = document.getElementById('match-msg');

function checkMatch() {
    if (!cfInput.value) { matchMsg.classList.add('d-none'); checkSubmit(); return; }
    const ok = pwInput.value === cfInput.value;
    matchMsg.classList.toggle('d-none', ok);
    cfInput.classList.toggle('is-invalid', !ok);
    cfInput.classList.toggle('is-valid',   ok);
    checkSubmit();
}
cfInput.addEventListener('input', checkMatch);

function checkSubmit() {
    const otpFull = boxes.every(b => b.value);
    const pwOk    = pwInput.value.length >= 6;
    const matchOk = pwInput.value === cfInput.value && cfInput.value.length >= 6;
    submitBtn.disabled = !(otpFull && pwOk && matchOk);
}

/* -------- Countdown 10 minutes -------- */
const TOTAL  = 600;
let   remain = TOTAL;
const ctText = document.getElementById('countdown-text');
const ctFill = document.getElementById('countdown-fill');

(function tick() {
    if (remain <= 0) {
        ctText.textContent = 'Hết hạn';
        ctText.className   = 'fw-semibold text-danger';
        ctFill.className   = 'strength-fill bg-danger';
        ctFill.style.width = '100%';
        submitBtn.disabled = true;
        return;
    }
    const m = Math.floor(remain / 60), s = remain % 60;
    ctText.textContent  = `${m}:${String(s).padStart(2,'0')}`;
    ctFill.style.width  = `${(remain / TOTAL) * 100}%`;
    if (remain <= 60) {
        ctText.className = 'fw-semibold text-danger';
        ctFill.classList.replace('bg-primary','bg-danger');
    } else if (remain <= 180) {
        ctText.className = 'fw-semibold text-warning';
        if (!ctFill.classList.contains('bg-warning'))
            ctFill.classList.replace('bg-primary','bg-warning');
    }
    remain--;
    setTimeout(tick, 1000);
}());

/* -------- Block submit on invalid -------- */
document.getElementById('reset-form').addEventListener('submit', e => {
    if (!boxes.every(b => b.value) || pwInput.value !== cfInput.value) {
        e.preventDefault();
        if (pwInput.value !== cfInput.value) matchMsg.classList.remove('d-none');
    }
});

/* -------- Auto-focus first OTP box -------- */
boxes[0].focus();
</script>
</body>
</html>
