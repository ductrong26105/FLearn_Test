<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mb-3">F</div>
            <h1 class="h3 fw-bold mb-1">FLearn</h1>
            <p class="text-muted mb-0">Flipped Classroom & Active Learning Platform</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 text-center">
            Tên đăng nhập hoặc mật khẩu không chính xác.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 text-center">
            Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${successMsg}" class="alert alert-success py-2 text-center" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-danger py-2 text-center" th:text="${errorMsg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tài khoản" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                    <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a th:href="@{/forgot-password}" class="text-decoration-none brand-text fw-semibold">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2">Đăng nhập</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted">Chưa có tài khoản?</span>
            <a th:href="@{/register}" class="text-decoration-none brand-text fw-semibold">Đăng ký sinh viên</a>
        </div>
    </section>
</main>
</body>
</html>
