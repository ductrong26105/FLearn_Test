<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả Quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }

        .result-layout { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: #64748b; font-size: .84rem; font-weight: 600;
            text-decoration: none; margin-bottom: 20px; transition: color .15s;
        }
        .back-link:hover { color: #f26b21; }

        /* Score card */
        .score-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 32px 28px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }
        .score-emoji { font-size: 3rem; margin-bottom: 8px; }
        .score-label { font-size: .8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
        .score-value { font-size: 3.5rem; font-weight: 800; color: #1e293b; line-height: 1; }
        .score-max { font-size: 1.1rem; color: #94a3b8; }
        .score-sub { font-size: .9rem; color: #64748b; margin-top: 10px; }

        /* Attempts table */
        .result-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }
        .result-card-header {
            padding: 16px 24px;
            border-bottom: 1px solid #f1f5f9;
            display: flex; align-items: center; gap: 10px;
        }
        .result-card-header h2 { font-size: .95rem; font-weight: 700; color: #1e293b; margin: 0; }

        .result-table { width: 100%; border-collapse: collapse; }
        .result-table th {
            background: #f8fafc;
            padding: 11px 20px;
            font-size: .72rem; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .5px;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }
        .result-table td {
            padding: 13px 20px;
            font-size: .88rem; color: #374151;
            border-bottom: 1px solid #f8fafc;
        }
        .result-table tr:last-child td { border-bottom: none; }
        .result-table tr:hover td { background: #fafbfc; }

        .score-pill {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 999px;
            font-size: .8rem; font-weight: 700;
        }
        .score-high { background: #dcfce7; color: #166534; }
        .score-mid  { background: #fef9c3; color: #854d0e; }
        .score-low  { background: #fee2e2; color: #991b1b; }

        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700;
            background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
        }
        .empty-row { text-align: center; padding: 40px; color: #94a3b8; font-size: .875rem; }

        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; color: #166534; padding: 12px 18px; font-weight: 600; font-size: .88rem; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .alert-danger  { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; color: #991b1b; padding: 12px 18px; font-weight: 600; font-size: .88rem; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    </style>
</head>
<body>
<div class="result-layout">
    <a th:href="@{/student/classes}" class="back-link">
        <i class="bi bi-arrow-left"></i> Lớp học của tôi
    </a>

    <div th:if="${successMsg}" class="alert-success">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
    </div>

    <!-- Score highlight for latest attempt -->
    <div class="score-card" th:if="${not #lists.isEmpty(attempts)}">
        <div th:with="latest=${attempts[0]}">
            <div class="score-emoji"
                 th:text="${latest.score >= 8 ? '🏆' : latest.score >= 5 ? '📝' : '💪'}">🏆</div>
            <div class="score-label">Điểm số lần gần nhất</div>
            <div class="score-value" th:text="${latest.score}">10</div>
            <div class="score-max">/10</div>
            <div class="score-sub"
                 th:text="${latest.correctCount + ' / ' + latest.totalQuestions + ' câu đúng • Lần ' + latest.attemptNo}">
                5/10 câu đúng
            </div>
        </div>
    </div>

    <!-- All attempts table -->
    <div class="result-card">
        <div class="result-card-header">
            <i class="bi bi-bar-chart-line text-muted"></i>
            <h2>Lịch sử nộp bài</h2>
        </div>
        <table class="result-table">
            <thead>
                <tr>
                    <th>Quiz</th>
                    <th>Lần</th>
                    <th>Điểm</th>
                    <th>Đúng</th>
                    <th>Trạng thái</th>
                    <th>Thời gian nộp</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${attempts}">
                    <td>
                        <div class="fw-semibold" style="color:#1e293b" th:text="${a.quiz.title}">Quiz</div>
                    </td>
                    <td>
                        <span style="color:#64748b;font-weight:600" th:text="${'#' + a.attemptNo}">#1</span>
                    </td>
                    <td>
                        <span class="score-pill"
                              th:classappend="${a.score >= 8 ? 'score-high' : a.score >= 5 ? 'score-mid' : 'score-low'}"
                              th:text="${a.score}">10</span>
                    </td>
                    <td th:text="${a.correctCount + ' / ' + a.totalQuestions}">5/10</td>
                    <td>
                        <span class="status-pill">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${a.status}">SUBMITTED</span>
                        </span>
                    </td>
                    <td style="color:#64748b"
                        th:text="${a.submittedAt != null ? #dates.format(a.submittedAt, 'dd/MM/yyyy HH:mm') : '-'}">
                        --
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(attempts)}">
                    <td colspan="6" class="empty-row">
                        <i class="bi bi-clipboard2-x d-block mb-2 fs-3"></i>
                        Chưa có lượt nộp bài nào.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
