<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/student/classes}">Lớp học của tôi</a>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    <div class="page-header"><h1 class="page-title">Kết quả quiz</h1></div>
    <section class="panel">
        <div class="panel-body table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Quiz</th><th>Điểm</th><th>Đúng</th><th>Lần</th><th>Trạng thái</th><th>Nộp lúc</th></tr></thead>
                <tbody>
                <tr th:each="attempt : ${attempts}">
                    <td th:text="${attempt.quiz.title}">Quiz</td>
                    <td class="fw-bold" th:text="${attempt.score}">10</td>
                    <td th:text="${attempt.correctCount + '/' + attempt.totalQuestions}">1/1</td>
                    <td th:text="${attempt.attemptNo}">1</td>
                    <td th:text="${attempt.status}">SUBMITTED</td>
                    <td th:text="${attempt.submittedAt != null ? #dates.format(attempt.submittedAt, 'dd/MM/yyyy HH:mm') : '-'}">time</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
