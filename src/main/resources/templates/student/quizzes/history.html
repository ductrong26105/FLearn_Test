<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/student/classes}">Lớp học của tôi</a>
    <div class="page-header"><h1 class="page-title">Lịch sử làm quiz</h1></div>
    <section class="panel">
        <div class="panel-body table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Quiz</th><th>Điểm</th><th>Đúng</th><th>Lần</th><th>Trạng thái</th><th>Nộp lúc</th></tr></thead>
                <tbody>
                <tr th:each="item : ${history}">
                    <td th:text="${item.quiz.title}">Quiz</td>
                    <td class="fw-bold" th:text="${item.score}">10</td>
                    <td th:text="${item.correctCount + '/' + item.totalQuestions}">1/1</td>
                    <td th:text="${item.attemptNo}">1</td>
                    <td th:text="${item.status}">SUBMITTED</td>
                    <td th:text="${item.submittedAt != null ? #dates.format(item.submittedAt, 'dd/MM/yyyy HH:mm') : '-'}">time</td>
                </tr>
                <tr th:if="${#lists.isEmpty(history)}"><td colspan="6"><div class="empty-state">Bạn chưa làm quiz nào.</div></td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
