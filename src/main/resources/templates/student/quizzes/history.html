<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử Quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }

        .history-layout { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: #64748b; font-size: .84rem; font-weight: 600;
            text-decoration: none; margin-bottom: 20px; transition: color .15s;
        }
        .back-link:hover { color: #f26b21; }

        .history-header { margin-bottom: 20px; }
        .history-header h1 { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin: 0 0 4px; }
        .history-header p  { font-size: .875rem; color: #64748b; margin: 0; }

        .history-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th {
            background: #f8fafc;
            padding: 11px 20px;
            font-size: .72rem; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .5px;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }
        .history-table td {
            padding: 13px 20px;
            font-size: .88rem; color: #374151;
            border-bottom: 1px solid #f8fafc;
            vertical-align: middle;
        }
        .history-table tr:last-child td { border-bottom: none; }
        .history-table tr:hover td { background: #fafbfc; }

        .score-pill {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 999px;
            font-size: .8rem; font-weight: 700;
        }
        .score-high { background: #dcfce7; color: #166534; }
        .score-mid  { background: #fef9c3; color: #854d0e; }
        .score-low  { background: #fee2e2; color: #991b1b; }

        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px;
            font-size: .75rem; font-weight: 700;
            background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
        }

        .correct-bar {
            display: flex; align-items: center; gap: 8px;
        }
        .correct-track {
            flex: 1; height: 6px; border-radius: 999px;
            background: #f1f5f9; overflow: hidden; min-width: 60px;
        }
        .correct-fill {
            height: 100%; border-radius: 999px;
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }
        .correct-label { font-size: .78rem; color: #64748b; white-space: nowrap; }

        .empty-state {
            text-align: center; padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; display: block; }
        .empty-state p  { font-size: .9rem; margin: 0; }
    </style>
</head>
<body>
<div class="history-layout">
    <a th:href="@{/student/classes}" class="back-link">
        <i class="bi bi-arrow-left"></i> Lớp học của tôi
    </a>

    <div class="history-header">
        <h1><i class="bi bi-clock-history me-2" style="color:#f26b21"></i>Lịch sử làm quiz</h1>
        <p>Toàn bộ lịch sử nộp bài của bạn trên tất cả các lớp.</p>
    </div>

    <div class="history-card">
        <table class="history-table">
            <thead>
                <tr>
                    <th>Quiz</th>
                    <th>Lần</th>
                    <th>Điểm</th>
                    <th>Kết quả</th>
                    <th>Trạng thái</th>
                    <th>Thời gian nộp</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${history}">
                    <td>
                        <div class="fw-semibold" style="color:#1e293b" th:text="${item.quiz.title}">Quiz</div>
                    </td>
                    <td>
                        <span style="color:#64748b;font-weight:600" th:text="${'#' + item.attemptNo}">#1</span>
                    </td>
                    <td>
                        <span class="score-pill"
                              th:classappend="${item.score >= 8 ? 'score-high' : item.score >= 5 ? 'score-mid' : 'score-low'}"
                              th:text="${item.score}">10</span>
                    </td>
                    <td>
                        <div class="correct-bar">
                            <div class="correct-track">
                                <div class="correct-fill"
                                     th:style="${'width:' + (item.totalQuestions > 0 ? (item.correctCount * 100 / item.totalQuestions) : 0) + '%'}">
                                </div>
                            </div>
                            <span class="correct-label" th:text="${item.correctCount + '/' + item.totalQuestions}">5/10</span>
                        </div>
                    </td>
                    <td>
                        <span class="status-pill">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${item.status}">SUBMITTED</span>
                        </span>
                    </td>
                    <td style="color:#64748b"
                        th:text="${item.submittedAt != null ? #dates.format(item.submittedAt,'dd/MM/yyyy HH:mm') : '-'}">
                        --
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-clipboard2-x"></i>
                            <p>Bạn chưa làm quiz nào.<br><small>Hãy vào lớp học và thực hiện bài kiểm tra.</small></p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
