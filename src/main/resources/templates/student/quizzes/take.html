<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${quiz.title} - FLearn|">Quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

        body { background: #f8fafc; }

        .quiz-layout {
            max-width: 780px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }

        /* ── Back link ── */
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: #64748b; font-size: .84rem; font-weight: 600;
            text-decoration: none; margin-bottom: 20px;
            transition: color .15s;
        }
        .back-link:hover { color: #f26b21; }

        /* ── Header card ── */
        .quiz-header-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }
        .quiz-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fff3e8; color: #c2410c;
            border: 1px solid #fed7aa;
            border-radius: 999px; font-size: .72rem; font-weight: 700;
            padding: 3px 10px; text-transform: uppercase; letter-spacing: .5px;
            margin-bottom: 8px;
        }
        .quiz-title { font-size: 1.45rem; font-weight: 800; color: #1e293b; margin: 0 0 4px; }
        .quiz-desc  { color: #64748b; font-size: .875rem; margin: 0; }

        /* ── Timer ── */
        .timer-box {
            flex-shrink: 0;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 18px;
            text-align: center;
            min-width: 100px;
        }
        .timer-label { font-size: .7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
        .timer-value { font-size: 1.6rem; font-weight: 800; color: #1e293b; font-variant-numeric: tabular-nums; }
        .timer-box.danger { border-color: #fca5a5; background: #fef2f2; }
        .timer-box.danger .timer-value { color: #dc2626; }
        .deadline-info { font-size: .72rem; color: #94a3b8; margin-top: 6px; }

        /* ── Progress bar ── */
        .quiz-progress-wrap { margin-bottom: 20px; }
        .quiz-progress-bar {
            display: flex; gap: 6px; margin-bottom: 8px;
        }
        .q-dot {
            flex: 1; height: 5px; border-radius: 999px;
            background: #e2e8f0;
            transition: background .25s;
        }
        .q-dot.answered { background: #22c55e; }
        .q-dot.current  { background: #f26b21; }
        .progress-text { font-size: .78rem; color: #64748b; font-weight: 600; }

        /* ── Question card ── */
        .question-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.04);
            transition: box-shadow .2s;
        }
        .question-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.08); }

        .q-num {
            font-size: .72rem; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
        }
        .q-text {
            font-size: 1rem; font-weight: 600; color: #1e293b;
            margin-bottom: 18px; line-height: 1.55;
        }

        /* ── Answer options ── */
        .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 576px) { .answer-grid { grid-template-columns: 1fr; } }

        .answer-label {
            display: flex; align-items: center; gap: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all .15s;
            user-select: none;
        }
        .answer-label:hover { border-color: #f26b21; background: #fff8f5; }
        .answer-label:has(input:checked) {
            border-color: #f26b21;
            background: #fff3e8;
        }
        .answer-key {
            width: 28px; height: 28px; flex-shrink: 0;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            font-size: .78rem; font-weight: 700; color: #64748b;
            transition: all .15s;
        }
        .answer-label:has(input:checked) .answer-key {
            background: #f26b21; color: #fff;
        }
        .answer-label input[type="radio"] { display: none; }
        .answer-text { font-size: .9rem; color: #334155; line-height: 1.45; }

        /* ── Submit area ── */
        .submit-area {
            position: sticky; bottom: 0;
            background: linear-gradient(0deg, #f8fafc 80%, transparent);
            padding: 20px 0 8px;
            margin-top: 8px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .submit-info { font-size: .82rem; color: #64748b; }
        .btn-submit-quiz {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #f26b21, #ea580c);
            color: #fff; border: none; border-radius: 12px;
            padding: 12px 28px; font-weight: 700; font-size: .9rem;
            cursor: pointer; transition: all .2s;
            box-shadow: 0 4px 14px rgba(242,107,33,.35);
        }
        .btn-submit-quiz:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(242,107,33,.45); }
        .btn-submit-quiz:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .empty-state {
            text-align: center; padding: 40px; color: #94a3b8;
            background: #fff; border-radius: 16px; border: 1px dashed #e2e8f0;
        }
    </style>
</head>
<body>
<div class="quiz-layout">
    <a th:href="@{/student/lessons/{id}(id=${quiz.lessonId})}" class="back-link">
        <i class="bi bi-arrow-left"></i> Quay lại lesson
    </a>

    <!-- ── Header ── -->
    <div class="quiz-header-card">
        <div>
            <div class="quiz-badge"><i class="bi bi-patch-question-fill"></i> Bài kiểm tra</div>
            <h1 class="quiz-title" th:text="${quiz.title}">Quiz title</h1>
            <p class="quiz-desc"
               th:text="${#strings.isEmpty(quiz.description) ? 'Hoàn thành bài kiểm tra để đánh giá kiến thức.' : quiz.description}">
                Description
            </p>
        </div>
        <!-- Timer -->
        <div class="timer-box" id="timerBox" th:data-time-limit="${quiz.timeLimitMinutes != null ? quiz.timeLimitMinutes : 0}">
            <div class="timer-label"><i class="bi bi-stopwatch"></i> Thời gian</div>
            <div class="timer-value" id="timerVal">--:--</div>
            <div class="deadline-info"
                 th:text="${quiz.deadline != null ? 'Deadline: ' + #dates.format(quiz.deadline,'dd/MM/yyyy HH:mm') : 'Không có deadline'}">
            </div>
        </div>
    </div>

    <!-- ── Progress ── -->
    <div class="quiz-progress-wrap" th:if="${not #lists.isEmpty(quiz.questions)}">
        <div class="quiz-progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">Đã trả lời: 0 / <span th:text="${#lists.size(quiz.questions)}">0</span></div>
    </div>

    <!-- ── Form ── -->
    <form id="quiz-form"
          th:action="@{/student/quizzes/{id}/submit(id=${quiz.quizId})}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="startedAt" th:value="${startedAt}" id="startedAtInput">

        <!-- Questions -->
        <div th:if="${not #lists.isEmpty(quiz.questions)}">
            <div th:each="question, iter : ${quiz.questions}"
                 class="question-card"
                 th:id="|qcard-${iter.index}|">
                <div class="q-num" th:text="|Câu ${iter.index + 1} / ${#lists.size(quiz.questions)}|">Câu 1</div>
                <div class="q-text" th:text="${question.questionText}">Question text</div>
                <div class="answer-grid">
                    <label class="answer-label" th:each="answer : ${question.answers}">
                        <input type="radio"
                               th:name="|question_${question.questionId}|"
                               th:value="${answer.code}"
                               th:data-qidx="${iter.index}"
                               onchange="onAnswerChange(this)">
                        <span class="answer-key" th:text="${answer.code}">A</span>
                        <span class="answer-text" th:text="${answer.text}">Answer</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Empty -->
        <div th:if="${#lists.isEmpty(quiz.questions)}" class="empty-state">
            <i class="bi bi-clipboard2-x fs-3 d-block mb-2 text-muted"></i>
            Quiz chưa có câu hỏi nào.
        </div>

        <!-- ── Submit area ── -->
        <div class="submit-area">
            <div class="submit-info">
                <i class="bi bi-info-circle me-1"></i>
                Hãy trả lời tất cả câu hỏi trước khi nộp bài.
            </div>
            <button class="btn-submit-quiz" type="submit"
                    id="btnSubmit"
                    th:disabled="${#lists.isEmpty(quiz.questions)}"
                    onclick="return confirmSubmit()">
                <i class="bi bi-check2-circle"></i> Nộp bài
            </button>
        </div>
    </form>
</div>

<script>
const totalQ = document.querySelectorAll('.question-card').length;
const answered = {};
const bar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');

// Build progress dots
for (let i = 0; i < totalQ; i++) {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (i === 0 ? ' current' : '');
    dot.id = 'dot-' + i;
    bar.appendChild(dot);
}

function onAnswerChange(radio) {
    const idx = parseInt(radio.dataset.qidx);
    answered[idx] = true;
    updateProgress();
}

function updateProgress() {
    const count = Object.keys(answered).length;
    for (let i = 0; i < totalQ; i++) {
        const dot = document.getElementById('dot-' + i);
        if (!dot) continue;
        dot.className = 'q-dot' +
            (answered[i] ? ' answered' : (i === getFirstUnanswered() ? ' current' : ''));
    }
    if (progressText) {
        progressText.innerHTML = 'Đã trả lời: <strong>' + count + '</strong> / ' + totalQ;
    }
}

function getFirstUnanswered() {
    for (let i = 0; i < totalQ; i++) {
        if (!answered[i]) return i;
    }
    return -1;
}

function confirmSubmit() {
    const count = Object.keys(answered).length;
    if (count < totalQ) {
        return confirm('Bạn còn ' + (totalQ - count) + ' câu chưa trả lời. Bạn có muốn nộp bài không?');
    }
    return confirm('Xác nhận nộp bài?');
}

// ── Timer ──
const timerBox = document.getElementById('timerBox');
const timerVal = document.getElementById('timerVal');
const form = document.getElementById('quiz-form');
const timeLimit = Number(timerBox.dataset.timeLimit || 0);

if (timeLimit <= 0) {
    timerVal.textContent = '∞';
} else {
    let seconds = timeLimit * 60;
    const tick = () => {
        if (seconds <= 0) { form.submit(); return; }
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        timerVal.textContent = m + ':' + String(s).padStart(2, '0');
        // Cảnh báo đỏ khi còn < 1 phút
        if (seconds <= 60) timerBox.classList.add('danger');
        seconds--;
        setTimeout(tick, 1000);
    };
    tick();
}
</script>
</body>
</html>
