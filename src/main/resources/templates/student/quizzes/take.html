<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${quiz.title + ' - FLearn'}">Quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/student/lessons/{id}(id=${quiz.lessonId})}">Quay lại lesson</a>
    <div class="page-header d-flex justify-content-between gap-3">
        <div>
            <h1 class="page-title" th:text="${quiz.title}">Quiz</h1>
            <p class="page-subtitle" th:text="${#strings.isEmpty(quiz.description) ? 'Hoàn thành bài kiểm tra trước deadline.' : quiz.description}">Description</p>
        </div>
        <div class="text-end">
            <div class="badge-status badge-pending" id="timer"
                 th:data-time-limit="${quiz.timeLimitMinutes != null ? quiz.timeLimitMinutes : 0}">Timer</div>
            <div class="small text-muted mt-2" th:text="${quiz.deadline != null ? 'Deadline: ' + #dates.format(quiz.deadline, 'dd/MM/yyyy HH:mm') : 'Không có deadline'}">Deadline</div>
        </div>
    </div>

    <form id="quiz-form" th:action="@{/student/quizzes/{id}/submit(id=${quiz.quizId})}" method="post" class="panel">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="startedAt" th:value="${startedAt}">
        <div class="panel-body">
            <div th:each="question, iter : ${quiz.questions}" class="mb-4 pb-3 border-bottom">
                <h2 class="h6 fw-bold" th:text="|Câu ${iter.index + 1}: ${question.questionText}|">Question</h2>
                <div class="row g-2 mt-2">
                    <label class="col-md-6" th:each="answer : ${question.answers}">
                        <span class="border rounded d-block p-3">
                            <input class="form-check-input me-2" type="radio"
                                   th:name="|question_${question.questionId}|"
                                   th:value="${answer.code}" required>
                            <span th:text="${answer.text}">Answer</span>
                        </span>
                    </label>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(quiz.questions)}" class="empty-state">Quiz chưa có câu hỏi.</div>
            <button class="btn btn-brand px-4" type="submit" th:disabled="${#lists.isEmpty(quiz.questions)}">Nộp bài</button>
        </div>
    </form>
</main>
<script>
    const timer = document.getElementById('timer');
    const form = document.getElementById('quiz-form');
    const timeLimit = Number(timer.dataset.timeLimit || 0);
    if (timeLimit <= 0) {
        // Không có giới hạn thời gian
        timer.textContent = 'Không giới hạn';
    } else {
        let seconds = timeLimit * 60;
        const tick = () => {
            if (seconds <= 0) {
                form.submit();
                return;
            }
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            timer.textContent = `${m}:${String(s).padStart(2, '0')}`;
            seconds -= 1;
            setTimeout(tick, 1000);
        };
        tick();
    }
</script>
</body>
</html>
