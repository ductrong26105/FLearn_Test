<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Học liệu lớp học - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a href="/student/classes" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Quay lại lớp
    </a>

    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Học liệu pre-class</h1>
            <p class="page-subtitle">Chỉ hiển thị roadmap đã publish và lesson đang visible.</p>
        </div>
        <a class="btn btn-outline-primary" href="/student/learning-history">
            <i class="bi bi-clock-history"></i> Lịch sử học
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-6" th:each="roadmap : ${roadmaps}">
            <section class="class-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between gap-3 mb-2">
                        <h2 class="h5 fw-bold mb-0" th:text="${roadmap.title}">Roadmap</h2>
                        <span class="badge-status badge-active">PUBLISHED</span>
                    </div>
                    <p class="text-muted small" th:text="${#strings.isEmpty(roadmap.description) ? 'Chưa có mô tả.' : roadmap.description}">
                        Description
                    </p>
                    <div class="list-group list-group-flush">
                        <a th:each="lesson : ${roadmap.lessons}"
                           th:href="@{/student/lessons/{id}(id=${lesson.lessonId})}"
                           class="list-group-item list-group-item-action px-0 d-flex justify-content-between align-items-center">
                            <span><strong th:text="${lesson.orderIndex}">0</strong>. <span th:text="${lesson.title}">Lesson</span></span>
                            <span class="text-muted small">Mở</span>
                        </a>
                    </div>
                    <div th:if="${#lists.isEmpty(roadmap.lessons)}" class="empty-state mt-3">Chưa có lesson visible.</div>
                </div>
            </section>
        </div>
        <div th:if="${#lists.isEmpty(roadmaps)}" class="col-12">
            <div class="empty-state">Lớp này chưa có roadmap được publish.</div>
        </div>
    </div>
</main>
</body>
</html>
