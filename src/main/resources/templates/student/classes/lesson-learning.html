<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${lesson.title} - FLearn|">Lesson - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        .video-embed-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }
        .video-embed-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<main class="app-shell">
    <a th:href="@{/student/classes/{id}/learning(id=${lesson.classId})}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Quay lại roadmap
    </a>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="page-header">
        <div>
            <span class="badge-status badge-active mb-2 d-inline-block" th:text="|Lesson ${lesson.orderIndex}|">Lesson 1</span>
            <h1 class="page-title" th:text="${lesson.title}">Lesson title</h1>
            <p class="page-subtitle" th:text="${#strings.isEmpty(lesson.content) ? 'Chưa có mô tả.' : lesson.content}">
                Description
            </p>
        </div>
    </div>

    <!-- ===== VIDEO BÀI HỌC (nếu có) ===== -->
    <section class="panel mb-3" th:if="${lesson.embedVideoUrl != null}">
        <div class="panel-body">
            <h2 class="h6 fw-semibold text-muted mb-2">
                <i class="bi bi-play-circle-fill text-danger me-1"></i>
                Video bài học
            </h2>
            <div class="video-embed-wrapper">
                <iframe th:src="${lesson.embedVideoUrl}"
                        allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-body">
            <h2 class="h5 fw-bold mb-3">Materials</h2>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Material</th>
                        <th>Type</th>
                        <th>Viewed</th>
                        <th style="width: 100px;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="material : ${materials}">
                        <td>
                            <div class="fw-semibold" th:text="${material.title}">Material</div>
                            <small class="text-muted" th:text="${#strings.isEmpty(material.description) ? 'Chưa có mô tả.' : material.description}">Description</small>
                        </td>
                        <td><span class="badge bg-light text-dark border" th:text="${material.type}">PDF</span></td>
                        <td>
                            <span class="badge-status"
                                  th:classappend="${material.viewed != null and material.viewed ? ' badge-active' : ' badge-pending'}"
                                  th:text="${material.viewed != null and material.viewed ? 'ĐÃ XEM' : 'MỚI'}">MỚI</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-brand" th:href="@{/student/materials/{id}(id=${material.id})}">Mở</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(materials)}">
                        <td colspan="4"><div class="empty-state">Lesson chưa có material được publish.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <section class="panel mt-4">
        <div class="panel-body">
            <h2 class="h5 fw-bold mb-3">Quiz</h2>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Bài kiểm tra</th>
                        <th>Deadline</th>
                        <th>Lượt làm</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="quiz : ${quizzes}">
                        <td>
                            <div class="fw-semibold" th:text="${quiz.title}">Quiz</div>
                            <small class="text-muted" th:text="${#strings.isEmpty(quiz.description) ? 'Kiểm tra nhanh sau bài học.' : quiz.description}">Description</small>
                        </td>
                        <td th:text="${quiz.deadline != null ? #dates.format(quiz.deadline, 'dd/MM/yyyy HH:mm') : 'Không có'}">Deadline</td>
                        <td th:text="${quiz.submittedAttempts + '/' + quiz.maxAttempts}">0/1</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-brand"
                               th:if="${not quiz.deadlinePassed and quiz.submittedAttempts lt quiz.maxAttempts}"
                               th:href="@{/student/quizzes/{id}(id=${quiz.quizId})}">Làm quiz</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/student/quizzes/{id}/results(id=${quiz.quizId})}">Kết quả</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(quizzes)}">
                        <td colspan="4"><div class="empty-state">Lesson chưa có quiz được publish.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
