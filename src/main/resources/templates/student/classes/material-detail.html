<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${material.title} - FLearn|">Material - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <style>
        .video-embed-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        }
        .video-embed-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .pdf-embed-wrapper {
            width: 100%;
            height: 70vh;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .pdf-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .material-type-badge {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 4px 12px;
            border-radius: 999px;
        }
        .material-type-VIDEO, .material-type-YOUTUBE_LINK {
            background: #fef3c7; color: #92400e;
        }
        .material-type-PDF, .material-type-DOCUMENT {
            background: #fee2e2; color: #991b1b;
        }
        .material-type-OTHER_LINK {
            background: #e0f2fe; color: #075985;
        }
    </style>
</head>
<body>
<main class="app-shell" style="max-width: 860px;">
    <a th:href="@{/student/lessons/{id}(id=${material.lessonId})}" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Quay lại lesson
    </a>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <section class="panel">
        <div class="panel-body">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                <div>
                    <span class="material-type-badge border mb-2 d-inline-block"
                          th:classappend="|material-type-${material.type}|"
                          th:text="${material.type}">TYPE</span>
                    <h1 class="page-title mb-1" th:text="${material.title}">Material title</h1>
                    <p class="page-subtitle mb-0"
                       th:text="${#strings.isEmpty(material.description) ? 'Chưa có mô tả.' : material.description}">
                        Description
                    </p>
                </div>
                <span class="badge-status flex-shrink-0"
                      th:classappend="${material.viewed != null and material.viewed ? ' badge-active' : ' badge-pending'}"
                      th:text="${material.viewed != null and material.viewed ? 'ĐÃ XEM' : 'MỚI'}">MỚI</span>
            </div>

            <hr class="my-3">

            <!-- ===== VIDEO EMBED (YouTube / Google Drive) ===== -->
            <div th:if="${material.embedUrl != null}" class="mb-4">
                <h2 class="h6 fw-semibold text-muted mb-2">
                    <i class="bi bi-play-circle-fill text-danger me-1"></i>
                    Xem video
                </h2>
                <div class="video-embed-wrapper">
                    <iframe th:src="${material.embedUrl}"
                            allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>
            </div>

            <!-- ===== PDF EMBED (file nội bộ được serve qua /files/) ===== -->
            <div th:if="${material.embedUrl == null and not #strings.isEmpty(material.filePath) and material.type.name() == 'PDF'}" class="mb-4">
                <h2 class="h6 fw-semibold text-muted mb-2">
                    <i class="bi bi-file-earmark-pdf-fill text-danger me-1"></i>
                    Xem tài liệu PDF
                </h2>
                <div class="pdf-embed-wrapper">
                    <iframe th:src="${material.filePath}"></iframe>
                </div>
            </div>

            <!-- ===== LINK FALLBACK (khi không thể embed) ===== -->
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a th:if="${not #strings.isEmpty(material.externalUrl)}"
                   class="btn btn-outline-primary"
                   th:href="${material.externalUrl}"
                   target="_blank">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span th:if="${material.embedUrl != null}">Mở trong tab mới</span>
                    <span th:unless="${material.embedUrl != null}">Mở link</span>
                </a>
                <a th:if="${not #strings.isEmpty(material.filePath) and material.type.name() != 'PDF'}"
                   class="btn btn-outline-success"
                   th:href="${material.filePath}"
                   target="_blank">
                    <i class="bi bi-download"></i> Tải file
                </a>
            </div>

            <!-- ===== ĐÁNH DẤU ĐÃ XEM ===== -->
            <form th:unless="${material.viewed != null and material.viewed}"
                  th:action="@{/student/materials/{id}/mark-viewed(id=${material.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-brand">
                    <i class="bi bi-check2-square"></i> Đánh dấu đã xem
                </button>
            </form>
            <div th:if="${material.viewed != null and material.viewed}" class="text-success fw-semibold">
                <i class="bi bi-check-circle-fill"></i> Bạn đã xem tài liệu này
            </div>

        </div>
    </section>
</main>
</body>
</html>
