<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài Giảng - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3 shadow-sm mb-4">
    <a class="navbar-brand fw-bold" th:href="@{/teacher/dashboard}">⬅ Quay lại </a>
    <span class="text-white">Quản lý Nội dung Bài Giảng</span>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-success text-white fw-bold">Đăng Bài Giảng Mới</div>
                <div class="card-body">
                    <form th:action="@{/teacher/class/{id}/add-lesson(id=${classId})}" method="post">
                        <div class="mb-3">
                            <label class="form-label small">Tên Bài Giảng</label>
                            <input type="text" name="title" class="form-control" placeholder="VD: Bài 1: Nhập môn Spring Boot" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Link Video YouTube (Tùy chọn)</label>
                            <input type="url" name="videoUrl" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Ghi chú / Tóm tắt nội dung</label>
                            <textarea name="content" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Đăng Bài</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div th:each="lesson : ${lessons}" class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h5 class="card-title text-primary fw-bold" th:text="${lesson.title}"></h5>
                    <p class="card-text small text-muted" th:text="'Ngày đăng: ' + ${#dates.format(lesson.createdAt, 'dd-MM-yyyy HH:mm')}"></p>
                    <p class="card-text small text-muted" th:text="'Ngày đăng: ' + ${#dates.format(lesson.createdAt, 'dd-MM-yyyy HH:mm')}"></p>

                    <a th:href="@{/teacher/lesson/{id}/quiz(id=${lesson.lessonId})}" class="btn btn-sm btn-outline-danger fw-bold mb-3">
                        📝 Soạn Bài Quiz cho bài học này
                    </a>
                    <p class="card-text" th:text="${lesson.content}"></p>

                    <div th:if="${lesson.videoUrl != null and !lesson.videoUrl.isEmpty()}" class="ratio ratio-16x9 mt-3">
                        <iframe th:src="${lesson.videoUrl}"
                                title="YouTube video player"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(lessons)}" class="text-center text-muted py-5">
                Chưa có bài giảng nào trong lớp này. Hãy đăng bài đầu tiên!
            </div>
        </div>
    </div>
</div>
</body>
</html>
