<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chỉnh sửa Lớp học')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="page-header mb-4">
                <a href="/admin/classes" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Quay lại</a>
                <h1 class="page-title text-dark">Chỉnh sửa Lớp học</h1>
                <p class="page-subtitle">Cập nhật thông tin chi tiết và cấu hình lớp học.</p>
            </div>
            
            <div class="row">
                <div class="col-12 col-lg-8">
                    <section class="panel">
                        <div class="panel-body">
                            <form th:action="@{'/admin/classes/' + ${classId} + '/edit'}" th:object="${classroomRequest}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                
                                <div class="mb-3">
                                    <label for="courseId" class="form-label fw-semibold">Khóa học / Môn học <span class="text-danger">*</span></label>
                                    <select id="courseId" th:field="*{courseId}" class="form-select" required>
                                        <option value="">-- Chọn khóa học --</option>
                                        <option th:each="course : ${courses}" 
                                                th:value="${course.id}" 
                                                th:text="${course.courseCode + ' - ' + course.courseName}"></option>
                                    </select>
                                    <div class="form-text text-danger" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="className" class="form-label fw-semibold">Tên lớp học <span class="text-danger">*</span></label>
                                    <input type="text" id="className" th:field="*{className}" class="form-control" required>
                                    <div class="form-text text-danger" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="teacherId" class="form-label fw-semibold">Giảng viên giảng dạy</label>
                                    <select id="teacherId" th:field="*{teacherId}" class="form-select">
                                        <option value="">-- Chưa gán giảng viên --</option>
                                        <option th:each="teacher : ${teachers}" 
                                                th:if="${teacher.status == 'ACTIVE'}"
                                                th:value="${teacher.userId}" 
                                                th:text="${teacher.fullName + ' (' + teacher.email + ')'}"></option>
                                    </select>
                                    <div class="form-text text-danger" th:if="${#fields.hasErrors('teacherId')}" th:errors="*{teacherId}"></div>
                                </div>
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <label for="startDate" class="form-label fw-semibold">Ngày bắt đầu</label>
                                        <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="endDate" class="form-label fw-semibold">Ngày kết thúc</label>
                                        <input type="date" id="endDate" th:field="*{endDate}" class="form-control">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label fw-semibold">Mô tả lớp học</label>
                                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                                </div>
                                
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-brand px-4">Lưu thay đổi</button>
                                    <a href="/admin/classes" class="btn btn-outline-secondary px-3">Hủy</a>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
