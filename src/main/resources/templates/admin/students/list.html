<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Quản lý sinh viên')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('students')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark">Quản lý Sinh viên</h1>
                    <p class="page-subtitle">Xem thông tin chi tiết, tìm kiếm, cập nhật và khóa/mở khóa sinh viên.</p>
                </div>
                <form th:action="@{/admin/students}" method="get" class="d-flex gap-2">
                    <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sinh viên...">
                    <button class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
                </form>
            </div>
            
            <section class="panel">
                <div class="panel-body p-0">
                    <div class="p-3 border-bottom bg-white d-flex align-items-center">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-mortarboard-fill me-2 text-primary"></i>Danh sách sinh viên</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Sinh viên</th>
                                <th>Email & SĐT</th>
                                <th>Khoa / Bộ môn</th>
                                <th>Trạng thái</th>
                                <th style="min-width: 130px;">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student : ${students}">
                                <td>
                                    <div class="fw-bold text-dark" th:text="${student.fullName}">Name</div>
                                    <small class="text-muted"><i class="bi bi-person"></i> [[${student.username}]]</small>
                                </td>
                                <td>
                                    <div th:text="${student.email}">email</div>
                                    <small class="text-muted" th:text="${student.phone != null and student.phone != '' ? student.phone : 'Chưa có SĐT'}">phone</small>
                                </td>
                                <td th:text="${student.department != null and student.department != '' ? student.department : '-'}">CNTT</td>
                                <td>
                                    <span class="badge-status" 
                                          th:classappend="${student.status == 'BLOCKED' ? ' badge-blocked' : ' badge-active'}" 
                                          th:text="${student.status}">ACTIVE</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <!-- Edit button -->
                                        <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#editStudentModal' + ${student.userId}">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </button>
                                        
                                        <!-- Block / Unblock form -->
                                        <form th:if="${student.status != 'BLOCKED'}" th:action="@{'/admin/students/' + ${student.userId} + '/block'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn KHÓA tài khoản sinh viên này?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-lock-fill"></i> Khóa</button>
                                        </form>
                                        <form th:if="${student.status == 'BLOCKED'}" th:action="@{'/admin/students/' + ${student.userId} + '/unblock'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn MỞ KHÓA tài khoản sinh viên này?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-sm btn-outline-success"><i class="bi bi-unlock-fill"></i> Mở</button>
                                        </form>
                                    </div>
                                    
                                    <!-- Edit Student Modal -->
                                    <div class="modal fade" th:id="'editStudentModal' + ${student.userId}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title fw-bold">Cập nhật thông tin sinh viên</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <form th:action="@{'/admin/students/' + ${student.userId} + '/update'}" method="post">
                                                    <div class="modal-body text-start">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                        <div class="mb-3">
                                                            <label class="form-label fw-semibold">Họ và Tên</label>
                                                            <input class="form-control" name="fullName" th:value="${student.fullName}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label fw-semibold">Email</label>
                                                            <input class="form-control" name="email" type="email" th:value="${student.email}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label fw-semibold">Số điện thoại</label>
                                                            <input class="form-control" name="phone" th:value="${student.phone}">
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label fw-semibold">Khoa / Bộ môn</label>
                                                            <input class="form-control" name="department" th:value="${student.department}">
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                                                        <button type="submit" class="btn btn-brand">Lưu thay đổi</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="5">
                                    <div class="empty-state text-muted text-center py-4">Không tìm thấy sinh viên nào.</div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
