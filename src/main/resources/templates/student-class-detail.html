<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Học Cùng - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success px-3 shadow-sm mb-4">
    <a class="navbar-brand fw-bold" th:href="@{/student/dashboard}">⬅ Quay lại Bàn học</a>
    <span class="text-white">Nội dung Bài Giảng</span>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div th:each="lesson : ${lessons}" class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h4 class="card-title text-success fw-bold" th:text="${lesson.title}"></h4>
                    <p class="card-text small text-muted" th:text="'Đăng ngày: ' + ${#dates.format(lesson.createdAt, 'dd-MM-yyyy HH:mm')}"></p>

                    <p class="card-text fs-5" th:text="${lesson.content}"></p>

                    <div th:if="${lesson.videoUrl != null and !lesson.videoUrl.isEmpty()}" class="ratio ratio-16x9 mt-4 shadow-sm rounded overflow-hidden">
                        <iframe th:src="${lesson.videoUrl}"
                                title="YouTube video player"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(lessons)}" class="text-center text-muted py-5">
                <h4>Giáo viên chưa đăng bài giảng nào cho môn này.</h4>
                <p>Bạn hãy quay lại sau nhé!</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
