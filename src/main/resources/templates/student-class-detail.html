<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Học Cùng - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success px-3 shadow-sm mb-4">
    <a class="navbar-brand fw-bold" th:href="@{/student/dashboard}">⬅ Quay lại </a>
    <span class="text-white">Nội dung Bài Giảng</span>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div th:each="lesson : ${lessons}" class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <h4 class="card-title text-success fw-bold" th:text="${lesson.title}"></h4>
                    <p class="card-text small text-muted" th:text="'Đăng ngày: ' + ${#dates.format(lesson.createdAt, 'dd-MM-yyyy HH:mm')}"></p>

                    <p class="card-text fs-5" th:text="${lesson.content}"></p>

                    <div th:if="${lesson.videoUrl != null and !lesson.videoUrl.isEmpty()}" class="ratio ratio-16x9 mt-4 shadow-sm rounded overflow-hidden">
                        <iframe th:src="${lesson.videoUrl}" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
                    </div>

                    <div class="mt-4 p-3 bg-white border rounded d-flex justify-content-between align-items-center">

                        <div th:if="${!quizService.isLessonCompleted(student, lesson.lessonId)}">
                            <form th:action="@{/student/lesson/{lId}/complete(lId=${lesson.lessonId})}" method="post" class="d-inline">
                                <input type="hidden" name="classId" th:value="${classId}">
                                <button type="submit" class="btn btn-danger fw-bold">✓ Đã xem xong video & Hoàn thành bài học</button>
                            </form>
                            <span class="text-muted small ms-3">⚠️ Bạn cần bấm nút hoàn thành để kích hoạt bài kiểm tra Quiz.</span>
                        </div>

                        <div th:if="${quizService.isLessonCompleted(student, lesson.lessonId)}">
                            <span class="badge bg-success fs-6 p-2">✓ Bạn đã hoàn thành nội dung bài học này</span>

                            <a th:if="${quizService.getQuizByLesson(lesson.lessonId) != null}"
                               th:href="@{/student/lesson/{lId}/quiz(lId=${lesson.lessonId})}"
                               class="btn btn-primary fw-bold ms-3">
                                📝 Làm Bài Kiểm Tra Quiz ngay
                            </a>
                            <span th:if="${quizService.getQuizByLesson(lesson.lessonId) == null}" class="text-muted small ms-2">(Bài học này không có Quiz)</span>
                        </div>

                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(lessons)}" class="text-center text-muted py-5">
                <h4>Giáo viên chưa đăng bài giảng nào cho môn này.</h4>
                <p>Bạn hãy quay lại sau nhé!</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
