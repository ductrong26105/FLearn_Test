<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảng Điểm Trắc Nghiệm - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3 shadow-sm mb-4">
    <a class="navbar-brand fw-bold" href="javascript:history.back()">⬅ Quay lại trình biên soạn</a>
    <span class="text-white fw-bold">Kết Quả Bảng Điểm Sinh Viên</span>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold fs-5 text-success">Danh Sách Điểm Số Làm Bài</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>STT</th>
                    <th>Họ và Tên Sinh Viên</th>
                    <th>Email</th>
                    <th>Điểm Số (Hệ 10)</th>
                    <th>Thời gian nộp bài</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="res, iter : ${results}">
                    <td th:text="${iter.index + 1}"></td>
                    <td class="fw-bold" th:text="${res.student.fullName}"></td>
                    <td th:text="${res.student.email}"></td>
                    <td>
                        <span class="badge fs-6"
                              th:classappend="${res.score >= 5.0 ? 'bg-success' : 'bg-danger'}"
                              th:text="${res.score} + ' / 10'"></span>
                    </td>
                    <td th:text="${#dates.format(res.completedAt, 'dd-MM-yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có sinh viên nào hoàn thành bài kiểm tra này.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
