<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Làm Bài Kiểm Tra - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h3 class="card-title mb-0 text-center fw-bold" th:text="${quiz.title}"></h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/student/quiz/{qId}/submit(qId=${quiz.quizId})}" method="post">
                        <input type="hidden" name="lessonId" th:value="${lessonId}">

                        <div th:each="q, iter : ${quiz.questions}" class="mb-4 p-3 bg-white border rounded shadow-xs">
                            <h5 class="fw-bold text-dark" th:text="'Câu ' + ${iter.index + 1} + ': ' + ${q.questionText}"></h5>
                            <div class="mt-2 ms-2">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" th:name="'question_' + ${q.questionId}" value="A" required>
                                    <label class="form-check-label" th:text="'A. ' + ${q.optionA}"></label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" th:name="'question_' + ${q.questionId}" value="B">
                                    <label class="form-check-label" th:text="'B. ' + ${q.optionB}"></label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" th:name="'question_' + ${q.questionId}" value="C">
                                    <label class="form-check-label" th:text="'C. ' + ${q.optionC}"></label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" th:name="'question_' + ${q.questionId}" value="D">
                                    <label class="form-check-label" th:text="'D. ' + ${q.optionD}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold shadow-sm">Nộp Bài Thi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
