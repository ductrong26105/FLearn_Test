<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Mật Khẩu Mới - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 400px;">
    <h3 class="text-center text-success mb-4">Tạo Mật Khẩu Mới</h3>

    <div th:if="${errorMsg}" class="alert alert-danger small" th:text="${errorMsg}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <label class="form-label small fw-bold">Nhập mật khẩu mới:</label>
            <input type="password" name="newPassword" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-success w-100">Xác Nhận Đổi Mật Khẩu</button>
    </form>
</div>
</body>
</html>
