<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard - FLearn LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success px-3 shadow-sm">
    <a class="navbar-brand fw-bold" href="#">Góc Học Tập - SE2029</a>
    <div class="d-flex align-items-center">
        <span class="text-white me-3" th:text="'Xin chào, ' + ${studentName}"></span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-light">Đăng xuất</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-primary text-white fw-bold">Tham Gia Lớp Học</div>
                <div class="card-body">
                    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
                    <form th:action="@{/student/join-class}" method="post">
                        <div class="mb-3">
                            <label class="form-label small">Mã Invite Code</label>
                            <input type="text" name="inviteCode" class="form-control" placeholder="Nhập mã 6 ký tự..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Tham Gia Ngay</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Các Lớp Đang Học</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Tên Lớp (Môn học)</th>
                            <th>Giáo Viên</th>
                            <th>Ngày tham gia</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${joinedClasses}">
                            <td class="fw-bold text-primary" th:text="${member.classroom.className}"></td>
                            <td th:text="${member.classroom.teacher.fullName}"></td>
                            <td th:text="${#dates.format(member.joinedAt, 'dd-MM-yyyy HH:mm')}"></td>
                            <td>
                                <a th:if="${member.status == 1}"
                                   th:href="@{/student/class/{id}(id=${member.classroom.classId})}"
                                   class="btn btn-sm btn-outline-primary fw-bold">
                                    ▶ Vào học
                                </a>

                                <span th:if="${member.status == 0}" class="badge bg-warning text-dark p-2 fs-6">⏳ Chờ giảng viên duyệt</span>

                                <span th:if="${member.status == 2}" class="badge bg-danger p-2 fs-6">❌ Bị từ chối vào lớp</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(joinedClasses)}">
                            <td colspan="4" class="text-center text-muted py-3">Bạn chưa tham gia lớp học nào. Xin mã từ Giáo viên nhé!</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
