<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="text-center text-primary mb-4">FLearn System</h3>
            <div th:if="${param.error}" class="alert alert-danger fs-6 p-2">Sai tài khoản hoặc mật khẩu!</div>
            <div th:if="${param.logout}" class="alert alert-info fs-6 p-2">Đã đăng xuất thành công.</div>
            <div th:if="${successMsg}" class="alert alert-success fs-6 p-2" th:text="${successMsg}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required placeholder="Nhập username">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Đăng Nhập</button>

                <div class="d-flex justify-content-between small">
                    <a href="/forgot-password" class="text-decoration-none">Quên mật khẩu?</a>
                    <a href="/register" class="text-decoration-none">Chưa có tài khoản? Đăng ký ngay</a>
                </div>
        </div>
    </div>
</div>
</body>
</html>
