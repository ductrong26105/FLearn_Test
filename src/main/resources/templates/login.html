<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Màu nền tổng thể hơi ngả vàng nhạt giống ảnh */
        body {
            background-color: #f7f6f2;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Khung trắng chứa Form */
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Đổ bóng nhẹ nhàng */
            padding: 40px;
            width: 100%;
            max-width: 400px; /* Form gọn gàng hơn */
            border: 1px solid #eaeaea;
        }

        /* --- MÀU CAM THƯƠNG HIỆU FLEARN --- */
        .text-brand {
            color: #ed5c15; /* Màu cam chữ */
        }

        .btn-brand {
            background-color: #ed5c15; /* Màu cam nút bấm */
            color: white;
            border: none;
            border-radius: 6px;
        }

        .btn-brand:hover {
            background-color: #d14d0f; /* Cam đậm khi di chuột */
            color: white;
        }

        /* CSS "Vẽ" Logo hình vuông bo góc chữ F */
        .logo-box {
            background-color: #ed5c15;
            color: #ffffff;
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            font-style: italic; /* Chữ F in nghiêng */
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(237, 92, 21, 0.3);
        }

        /* Định dạng các ô input giống ảnh */
        .form-control {
            background-color: #f4f3f0; /* Nền xám nhạt */
            border: 1px solid #e0dfdb;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(237, 92, 21, 0.2);
            border-color: #ed5c15;
            background-color: #ffffff;
        }

        /* Chữ nhỏ ở dòng Subtitle */
        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #f79d6e; /* Cam nhạt */
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="logo-box">F</div>

        <h3 class="fw-bold mb-1 text-brand">FLearn System</h3>
        <p class="subtitle fw-bold mb-4">Learning Management System</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger small p-2 text-center border-0 mb-3">
        Email hoặc mật khẩu không chính xác!
    </div>
    <div th:if="${param.logout}" class="alert alert-success small p-2 text-center border-0 mb-3">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required autofocus>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 small">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>
            <a th:href="@{/forgot-password}" class="text-decoration-none text-brand">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">Đăng nhập</button>
    </form>

    <div class="text-center mt-4 small">
        <span class="text-muted">Chưa có tài khoản?</span>
        <a th:href="@{/register}" class="text-decoration-none text-brand">Đăng ký</a>
    </div>
</div>

</body>
</html>
