<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ACE TEAM LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3 shadow-sm">
    <a class="navbar-brand fw-bold" href="#">Admin Panel </a>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-sm btn-outline-light">Đăng xuất</button>
    </form>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-primary text-white fw-bold">Cấp tài khoản Giáo viên</div>
                <div class="card-body">
                    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
                    <form th:action="@{/admin/create-teacher}" method="post">
                        <div class="mb-2">
                            <label class="form-label small">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Họ và Tên</label>
                            <input type="text" name="fullName" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Email</label>
                            <input type="email" name="email" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Mật khẩu</label>
                            <input type="password" name="password" class="form-control form-control-sm" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Tạo Tài Khoản</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Quản lý Hệ thống Người dùng</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Họ và Tên</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.userId}"></td>
                            <td class="fw-semibold" th:text="${user.username}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td>
                                <span th:if="${user.role == 0}" class="badge bg-danger">Admin</span>
                                <span th:if="${user.role == 1}" class="badge bg-warning text-dark">Teacher</span>
                                <span th:if="${user.role == 2}" class="badge bg-success">Student</span>
                            </td>
                            <td>
                                <span th:if="${user.isActive}" class="text-success small fw-bold">Active</span>
                                <span th:unless="${user.isActive}" class="text-danger small fw-bold">Banned</span>
                            </td>
                            <td>
                                <form th:if="${user.role != 0}" th:action="@{/admin/toggle-user}" method="post">
                                    <input type="hidden" name="userId" th:value="${user.userId}">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${user.isActive ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:text="${user.isActive ? 'Khóa' : 'Mở Khóa'}"></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
