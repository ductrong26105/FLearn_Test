<div th:fragment="alerts" xmlns:th="http://www.thymeleaf.org">
    <!-- Success Alert -->
    <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center alert-dismissible fade show mb-4 p-3 shadow-sm" role="alert" style="border-left: 5px solid #10b981; background-color: #ecfdf5; color: #065f46;">
        <i class="bi bi-check-circle-fill me-3 fs-5"></i>
        <div th:text="${successMsg}" class="fw-semibold">Success message here.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <!-- Error Alert -->
    <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center alert-dismissible fade show mb-4 p-3 shadow-sm" role="alert" style="border-left: 5px solid #ef4444; background-color: #fef2f2; color: #991b1b;">
        <i class="bi bi-exclamation-triangle-fill me-3 fs-5"></i>
        <div th:text="${errorMsg}" class="fw-semibold">Error message here.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
