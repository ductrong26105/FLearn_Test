<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 400px;">
    <h3 class="text-center text-primary mb-4">Khôi Phục Mật Khẩu</h3>

    <div th:if="${errorMsg}" class="alert alert-danger small" th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success small" th:text="${successMsg}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold">Nhập Email của bạn:</label>
            <input type="email" name="email" class="form-control" placeholder="VD: minhtuan@gmail.com" required>
            <div class="form-text">Hệ thống sẽ gửi mã xác thực vào email này.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Gửi Email Đặt Lại Mật Khẩu</button>
        <a href="/login" class="btn btn-outline-secondary w-100">Quay lại đăng nhập</a>
    </form>
</div>
</body>
</html>
