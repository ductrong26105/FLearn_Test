<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' - FLearn'}">Quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a th:if="${quiz != null}" class="btn btn-outline-secondary mb-3"
       th:href="@{/teacher/lessons/{id}/quizzes(id=${quiz.lessonId})}">Quay lại</a>
    <a th:if="${lesson != null}" class="btn btn-outline-secondary mb-3"
       th:href="@{/teacher/lessons/{id}/quizzes(id=${lesson.lessonId})}">Quay lại</a>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="page-header">
        <h1 class="page-title" th:text="${pageTitle}">Cấu hình quiz</h1>
        <p class="page-subtitle">Thiết lập publish, deadline, thời gian làm bài và số lần làm.</p>
    </div>

    <form class="panel mb-4" th:action="@{${formAction}}" th:object="${quizRequest}" method="post">
        <div class="panel-body row g-3">
            <div class="col-md-8">
                <label class="form-label">Tên quiz</label>
                <input class="form-control" th:field="*{title}" required maxlength="200">
            </div>
            <div class="col-md-4">
                <label class="form-label">Số lần làm</label>
                <input class="form-control" type="number" min="1" max="50" th:field="*{maxAttempts}">
            </div>
            <div class="col-12">
                <label class="form-label">Mô tả</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">Thời gian làm bài (phút)</label>
                <input class="form-control" type="number" min="1" max="600" th:field="*{timeLimitMinutes}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Deadline</label>
                <input class="form-control" type="datetime-local" name="deadline"
                       th:value="${quizRequest.deadline != null ? #dates.format(quizRequest.deadline, 'yyyy-MM-dd''T''HH:mm') : ''}">
            </div>
            <div class="col-md-4 d-flex align-items-end gap-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{shuffleQuestions}">
                    <label class="form-check-label">Đảo câu hỏi</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{shuffleAnswers}">
                    <label class="form-check-label">Đảo đáp án</label>
                </div>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-brand px-4" type="submit">Lưu cấu hình</button>
            </div>
        </div>
    </form>

    <div th:if="${quiz != null}">
        <div class="d-flex gap-2 mb-4">
            <form th:action="@{/teacher/quizzes/{id}/publish(id=${quiz.quizId})}" method="post">
                <button class="btn btn-outline-primary" type="submit" th:text="${quiz.published ? 'Unpublish' : 'Publish'}">Publish</button>
            </form>
            <a class="btn btn-outline-secondary" th:href="@{/teacher/quizzes/{id}/results(id=${quiz.quizId})}">Xem kết quả</a>
            <form th:action="@{/teacher/quizzes/{id}/delete(id=${quiz.quizId})}" method="post" onsubmit="return confirm('Xóa quiz này và toàn bộ kết quả?');">
                <button class="btn btn-outline-danger" type="submit">Xóa quiz</button>
            </form>
        </div>

        <section class="panel mb-4">
            <div class="panel-body">
                <h2 class="h5 fw-bold mb-3">Thêm câu hỏi</h2>
                <form th:action="@{/teacher/quizzes/{id}/questions/create(id=${quiz.quizId})}" th:object="${questionRequest}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Loại câu hỏi</label>
                        <select class="form-select" th:field="*{type}">
                            <option th:each="type : ${questionTypes}" th:value="${type}" th:text="${type}">TYPE</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Thứ tự</label>
                        <input class="form-control" type="number" th:field="*{orderIndex}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Đáp án đúng</label>
                        <select class="form-select" th:field="*{correctAnswer}">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="TRUE">TRUE</option>
                            <option value="FALSE">FALSE</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Nội dung câu hỏi</label>
                        <textarea class="form-control" rows="2" th:field="*{questionText}" required></textarea>
                    </div>
                    <div class="col-md-6"><input class="form-control" th:field="*{optionA}" placeholder="Đáp án A"></div>
                    <div class="col-md-6"><input class="form-control" th:field="*{optionB}" placeholder="Đáp án B"></div>
                    <div class="col-md-6"><input class="form-control" th:field="*{optionC}" placeholder="Đáp án C"></div>
                    <div class="col-md-6"><input class="form-control" th:field="*{optionD}" placeholder="Đáp án D"></div>
                    <div class="col-12"><button class="btn btn-brand" type="submit">Thêm câu hỏi</button></div>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-body table-responsive">
                <h2 class="h5 fw-bold mb-3">Danh sách câu hỏi</h2>
                <table class="table align-middle">
                    <tbody>
                    <tr th:each="question : ${quiz.questions}">
                        <td>
                            <div class="fw-semibold" th:text="${question.questionText}">Question</div>
                            <small class="text-muted" th:text="${question.type + ' - Đáp án: ' + question.correctAnswer}">Type</small>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/teacher/questions/{id}/edit(id=${question.questionId})}">Sửa</a>
                            <form class="d-inline" th:action="@{/teacher/questions/{id}/delete(id=${question.questionId})}" method="post" onsubmit="return confirm('Xóa câu hỏi này?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(quiz.questions)}">
                        <td><div class="empty-state">Quiz chưa có câu hỏi.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
