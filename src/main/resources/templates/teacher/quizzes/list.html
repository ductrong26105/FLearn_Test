<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Danh sách bài tập')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <a class="btn btn-outline-secondary mb-3" th:href="@{/teacher/lessons/{id}/edit(id=${lesson.lessonId})}">Quay lại</a>
            
            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
            
            <div class="page-header d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <h1 class="page-title text-dark">Danh sách bài tập</h1>
                    <p class="page-subtitle" th:text="${lesson.title}">Lesson</p>
                </div>
                <!-- Luôn hiển thị nút tạo bài tập mới -->
                <a class="btn btn-brand"
                   th:href="@{/teacher/lessons/{id}/quizzes/create(id=${lesson.lessonId})}">
                    <i class="bi bi-plus-lg me-1"></i>Thêm bài tập
                </a>
            </div>
            
            <section class="panel">
                <div class="panel-body table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Bài tập</th>
                            <th>Trạng thái</th>
                            <th>Thời gian</th>
                            <th>Deadline</th>
                            <th>Số lần</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="quiz : ${quizzes}">
                            <td>
                                <div class="fw-semibold" th:text="${quiz.title}">Quiz title</div>
                                <small class="text-muted" th:text="${#strings.isEmpty(quiz.description) ? 'Chưa có mô tả.' : quiz.description}">Description</small>
                            </td>
                            <td>
                                <span class="badge-status" th:classappend="${quiz.published ? ' badge-active' : ' badge-pending'}"
                                      th:text="${quiz.published ? 'PUBLISHED' : 'DRAFT'}">DRAFT</span>
                            </td>
                            <td th:text="${quiz.timeLimitMinutes != null ? quiz.timeLimitMinutes + ' phút' : 'Không giới hạn'}">30 phút</td>
                            <td th:text="${quiz.deadline != null ? #dates.format(quiz.deadline, 'dd/MM/yyyy HH:mm') : 'Không có'}">Deadline</td>
                            <td th:text="${quiz.maxAttempts}">1</td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-1">
                                    <form th:action="@{/teacher/quizzes/{id}/publish(id=${quiz.quizId})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-sm" th:classappend="${quiz.published ? 'btn-outline-secondary' : 'btn-outline-success'}" th:title="${quiz.published ? 'Ẩn' : 'Hiện'}">
                                            <i class="bi" th:classappend="${quiz.published ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                        </button>
                                    </form>
                                    <a class="btn btn-sm btn-brand" th:href="@{/teacher/quizzes/{id}/edit(id=${quiz.quizId})}">
                                        <i class="bi bi-pencil-square me-1"></i>Chi tiết
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:attr="data-quiz-id=${quiz.quizId}, data-quiz-title=${quiz.title}"
                                            onclick="showDeleteModal(this)">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(quizzes)}">
                            <td colspan="6"><div class="empty-state">Lesson này chưa có bài tập nào.</div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteQuizModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content" style="border:none; border-radius:16px; box-shadow: 0 20px 60px rgba(0,0,0,.15);">
            <div class="modal-body text-center" style="padding:32px;">
                <div style="width:64px; height:64px; border-radius:50%; background:#fef2f2; color:#dc2626; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:1.8rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h5 style="font-weight:800; color:#0f172a; margin-bottom:8px;">Xóa bài tập?</h5>
                <p style="color:#64748b; font-size:.95rem;">Bài tập <strong id="deleteQuizName"></strong> và toàn bộ câu hỏi, kết quả sẽ bị xóa vĩnh viễn.</p>
            </div>
            <div class="modal-footer" style="border:none; padding:0 32px 28px; justify-content:center; gap:10px;">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="border-radius:10px; font-weight:600;">Hủy</button>
                <form id="deleteQuizForm" method="post" style="margin:0">
                    <button type="submit" class="btn btn-danger" style="border-radius:10px; font-weight:700; box-shadow: 0 4px 12px rgba(220,38,38,.3);">
                        <i class="bi bi-trash3"></i> Xóa vĩnh viễn
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
    function showDeleteModal(btn) {
        const quizId = btn.getAttribute('data-quiz-id');
        const quizTitle = btn.getAttribute('data-quiz-title');
        document.getElementById('deleteQuizName').textContent = quizTitle;
        document.getElementById('deleteQuizForm').action = '/teacher/quizzes/' + quizId + '/delete';
        new bootstrap.Modal(document.getElementById('deleteQuizModal')).show();
    }
</script>
</body>
</html>
