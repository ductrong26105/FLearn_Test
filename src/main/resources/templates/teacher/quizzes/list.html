<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/teacher/lessons/{id}/edit(id=${lesson.lessonId})}">Quay lại lesson</a>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <div class="page-header d-flex justify-content-between align-items-start gap-3">
        <div>
            <h1 class="page-title">Quiz của lesson</h1>
            <p class="page-subtitle" th:text="${lesson.title}">Lesson</p>
        </div>
        <!-- Chỉ hiện "Tạo quiz" khi lesson chưa có quiz nào -->
        <a th:if="${#lists.isEmpty(quizzes)}"
           class="btn btn-brand"
           th:href="@{/teacher/lessons/{id}/quizzes/create(id=${lesson.lessonId})}">
            Tạo quiz
        </a>
        <!-- Nếu đã có quiz → nút Cấu hình quiz hiện có -->
        <a th:unless="${#lists.isEmpty(quizzes)}"
           class="btn btn-brand"
           th:href="@{/teacher/quizzes/{id}/edit(id=${quizzes[0].quizId})}">
            <i class="bi bi-gear me-1"></i>Cấu hình quiz
        </a>
    </div>


    <section class="panel">
        <div class="panel-body table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Quiz</th>
                    <th>Trạng thái</th>
                    <th>Thời gian</th>
                    <th>Deadline</th>
                    <th>Số lần</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="quiz : ${quizzes}">
                    <td>
                        <div class="fw-semibold" th:text="${quiz.title}">Quiz title</div>
                        <small class="text-muted" th:text="${#strings.isEmpty(quiz.description) ? 'Chưa có mô tả.' : quiz.description}">Description</small>
                    </td>
                    <td>
                        <span class="badge-status" th:classappend="${quiz.published ? ' badge-active' : ' badge-pending'}"
                              th:text="${quiz.published ? 'PUBLISHED' : 'DRAFT'}">DRAFT</span>
                    </td>
                    <td th:text="${quiz.timeLimitMinutes != null ? quiz.timeLimitMinutes + ' phút' : 'Không giới hạn'}">30 phút</td>
                    <td th:text="${quiz.deadline != null ? #dates.format(quiz.deadline, 'dd/MM/yyyy HH:mm') : 'Không có'}">Deadline</td>
                    <td th:text="${quiz.maxAttempts}">1</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-brand" th:href="@{/teacher/quizzes/{id}/edit(id=${quiz.quizId})}">Cấu hình</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(quizzes)}">
                    <td colspan="6"><div class="empty-state">Lesson này chưa có quiz.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
