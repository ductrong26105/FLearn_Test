<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả quiz - FLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="app-shell">
    <a class="btn btn-outline-secondary mb-3" th:href="@{/teacher/quizzes/{id}/edit(id=${quiz.quizId})}">Quay lại quiz</a>
    <div class="page-header">
        <h1 class="page-title">Kết quả bài làm</h1>
        <p class="page-subtitle" th:text="${quiz.title}">Quiz</p>
    </div>
    <section class="panel">
        <div class="panel-body table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Student</th><th>Điểm</th><th>Đúng</th><th>Lần</th><th>Trạng thái</th><th>Nộp lúc</th></tr></thead>
                <tbody>
                <tr th:each="result : ${results}">
                    <td th:text="${result.student.fullName}">Student</td>
                    <td class="fw-bold" th:text="${result.score}">10</td>
                    <td th:text="${result.correctCount + '/' + result.totalQuestions}">1/1</td>
                    <td th:text="${result.attemptNo}">1</td>
                    <td th:text="${result.status}">SUBMITTED</td>
                    <td th:text="${result.submittedAt != null ? #dates.format(result.submittedAt, 'dd/MM/yyyy HH:mm') : '-'}">time</td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}"><td colspan="6"><div class="empty-state">Chưa có bài nộp.</div></td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
