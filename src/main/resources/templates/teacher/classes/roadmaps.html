<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Quản lý Học liệu')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="breadcrumb-wrapper">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/teacher/classes">Lớp học</a></li>
                        <li class="breadcrumb-item"><a th:href="@{'/teacher/classes/' + ${classroom.classId}}">Chi tiết lớp</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Học liệu</li>
                    </ol>
                </nav>
            </div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark">Học liệu pre-class (Roadmaps)</h1>
                    <p class="page-subtitle">
                        Lớp học: <strong th:text="${classroom.className}">Class Name</strong>
                    </p>
                </div>
                <a class="btn btn-brand" th:href="@{'/teacher/classes/' + ${classroom.classId} + '/roadmaps/create'}">
                    <i class="bi bi-plus-circle-fill me-2"></i>Tạo Roadmap
                </a>
            </div>
            
            <div class="row g-4">
                <div class="col-md-6 col-xl-4" th:each="roadmap : ${roadmaps}">
                    <article class="class-card d-flex flex-column">
                        <div class="card-body p-4 flex-grow-1 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                                    <h2 class="h5 fw-bold mb-0 text-dark text-truncate" style="max-width: 200px;" th:text="${roadmap.title}">Roadmap Title</h2>
                                    <span class="badge-status align-self-start"
                                          th:classappend="${roadmap.published ? ' badge-active' : ' badge-pending'}"
                                          th:text="${roadmap.published ? 'PUBLISHED' : 'DRAFT'}">DRAFT</span>
                                </div>
                                <p class="text-muted small mb-4" style="height: 4.5em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;" th:text="${roadmap.description != null and !#strings.isEmpty(roadmap.description) ? roadmap.description : 'Chưa có mô tả chi tiết cho roadmap này.'}">Description</p>
                            </div>
                            
                            <div class="pt-3 border-top d-flex flex-wrap align-items-center gap-2">
                                <a class="btn btn-sm btn-brand px-3" th:href="@{'/teacher/roadmaps/' + ${roadmap.id} + '/edit'}">
                                    <i class="bi bi-pencil-square"></i> Cấu trúc & Bài học
                                </a>
                                
                                <div class="dropdown ms-auto">
                                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                                        <li>
                                            <form th:action="@{'/teacher/roadmaps/' + ${roadmap.id} + '/publish'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn Thay đổi trạng thái hiển thị của Roadmap này?');" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="dropdown-item py-2">
                                                    <i class="bi bi-eye-fill me-2 text-success" th:if="${!roadmap.published}"></i>
                                                    <i class="bi bi-eye-slash-fill me-2 text-warning" th:if="${roadmap.published}"></i>
                                                    <span th:text="${roadmap.published ? 'Unpublish (Ẩn)' : 'Publish (Hiện)'}">Publish</span>
                                                </button>
                                            </form>
                                        </li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li>
                                            <form th:action="@{'/teacher/roadmaps/' + ${roadmap.id} + '/delete'}" method="post" onsubmit="return confirm('CẢNH BÁO: Xóa roadmap sẽ xóa sạch toàn bộ bài học (Lessons) và học liệu (Materials) thuộc về nó. Hành động này không thể hoàn tác. Bạn chắc chắn muốn xóa?');" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="dropdown-item py-2 text-danger"><i class="bi bi-trash-fill me-2"></i>Xóa Roadmap</button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
                
                <div th:if="${#lists.isEmpty(roadmaps)}" class="col-12">
                    <div class="empty-state text-muted text-center py-4">Lớp học chưa có roadmap nào được cấu hình. Hãy tạo roadmap đầu tiên!</div>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
