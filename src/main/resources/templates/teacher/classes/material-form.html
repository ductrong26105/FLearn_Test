<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4" style="max-width: 800px;">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="breadcrumb-wrapper">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" th:if="${lesson != null}">
                        <li class="breadcrumb-item"><a href="/teacher/classes">Lớp học</a></li>
                        <li class="breadcrumb-item"><a th:href="@{'/teacher/lessons/' + ${lesson.lessonId} + '/edit'}">Bài học</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${pageTitle}">Học liệu</li>
                    </ol>
                    <ol class="breadcrumb" th:if="${material != null}">
                        <li class="breadcrumb-item"><a href="/teacher/classes">Lớp học</a></li>
                        <li class="breadcrumb-item"><a th:href="@{'/teacher/lessons/' + ${material.lessonId} + '/edit'}">Bài học</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${pageTitle}">Học liệu</li>
                    </ol>
                </nav>
            </div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark" th:text="${pageTitle}">Học liệu (Material)</h1>
                    <p class="page-subtitle">Cập nhật thông tin chi tiết, đường dẫn video hoặc tải lại tệp tin.</p>
                </div>
            </div>
            
            <form th:action="@{${formAction}}" th:object="${materialRequest}" method="post" enctype="multipart/form-data" class="panel">
                <div class="panel-body">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Tên học liệu</label>
                        <input class="form-control" th:field="*{title}" placeholder="Nhập tên học liệu..." required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Mô tả học liệu</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Nhập mô tả nội dung..."></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Loại học liệu</label>
                        <select class="form-select" th:field="*{type}" required>
                            <option value="">Chọn loại...</option>
                            <option th:each="type : ${materialTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">External URL (Youtube, Drive, etc.)</label>
                        <input class="form-control" th:field="*{externalUrl}" placeholder="https://...">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Tệp tin mới (File Upload)</label>
                        <input class="form-control" type="file" name="file">
                        <div th:if="${material != null and material.filePath != null}" class="form-text mt-2 p-2 bg-light rounded border">
                            <i class="bi bi-file-earmark-check text-success me-2"></i>Tệp hiện tại: 
                            <a th:href="${material.filePath}" target="_blank" class="fw-semibold text-break">[[${material.filePath}]]</a>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button class="btn btn-brand px-4 py-2"><i class="bi bi-save me-2"></i>Lưu học liệu</button>
                        
                        <button th:if="${material != null}" type="button" class="btn btn-outline-danger px-3 py-2" onclick="if(confirm('Bạn có chắc chắn muốn xóa học liệu này?')) document.getElementById('delete-material-form').submit();">
                            <i class="bi bi-trash"></i> Xóa
                        </button>
                        
                        <a th:if="${material != null}" th:href="@{'/teacher/lessons/' + ${material.lessonId} + '/edit'}" class="btn btn-outline-secondary px-3 py-2">Quay lại</a>
                        <a th:if="${lesson != null}" th:href="@{'/teacher/lessons/' + ${lesson.lessonId} + '/edit'}" class="btn btn-outline-secondary px-3 py-2">Quay lại</a>
                    </div>
                </div>
            </form>
            
            <form th:if="${material != null}" id="delete-material-form" th:action="@{'/teacher/materials/' + ${material.id} + '/delete'}" method="post" style="display:none;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
